<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 962 432" width="962" height="432" font-family="Arial, sans-serif"><title>Продуктовые гипотезы</title><rect width="100%" height="100%" fill="#f4f4f4"/>
<rect x="0" y="0" width="310" height="208" rx="16" fill="#fff"/>
<text x="20" y="38" font-size="18" fill="#252525">Если разнести настройки</text>
<text x="20" y="62" font-size="18" fill="#252525">по разным вкладкам и оставить</text>
<text x="20" y="86" font-size="18" fill="#252525">рядом предпросмотр светлой</text>
<text x="20" y="110" font-size="18" fill="#252525">и тёмной тем, пользователю</text>
<text x="20" y="134" font-size="18" fill="#252525">будет проще находить нужные</text>
<text x="20" y="158" font-size="18" fill="#252525">параметры и оценивать</text>
<text x="20" y="182" font-size="18" fill="#252525">изменения</text>
<rect x="326" y="0" width="310" height="208" rx="16" fill="#fff"/>
<text x="346" y="38" font-size="18" fill="#252525">Если выделить генерацию</text>
<text x="346" y="62" font-size="18" fill="#252525">палитры в отдельный блок</text>
<text x="346" y="86" font-size="18" fill="#252525">в цветах, пользователю будет</text>
<text x="346" y="110" font-size="18" fill="#252525">проще найти эту возможность</text>
<text x="346" y="134" font-size="18" fill="#252525">и настроить цвета без ручного</text>
<text x="346" y="158" font-size="18" fill="#252525">подбора всей палитры</text>
<rect x="652" y="0" width="310" height="208" rx="16" fill="#fff"/>
<text x="672" y="38" font-size="18" fill="#252525">Если дать возможность</text>
<text x="672" y="62" font-size="18" fill="#252525">выбрать шрифты</text>
<text x="672" y="86" font-size="18" fill="#252525">для основного текста</text>
<text x="672" y="110" font-size="18" fill="#252525">и заголовков или подключить</text>
<text x="672" y="134" font-size="18" fill="#252525">собственные, пользователь</text>
<text x="672" y="158" font-size="18" fill="#252525">сможет настроить типографику</text>
<text x="672" y="182" font-size="18" fill="#252525">по брендбуку</text>
<rect x="0" y="224" width="310" height="208" rx="16" fill="#fff"/>
<text x="20" y="262" font-size="18" fill="#252525">Если позволить изменить</text>
<text x="20" y="286" font-size="18" fill="#252525">название сервиса вместе</text>
<text x="20" y="310" font-size="18" fill="#252525">с логотипом, компания сможет</text>
<text x="20" y="334" font-size="18" fill="#252525">оформить сервис под своим</text>
<text x="20" y="358" font-size="18" fill="#252525">брендом</text>
</svg>
