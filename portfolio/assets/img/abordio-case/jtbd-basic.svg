<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 338" width="848" height="338" font-family="Arial, sans-serif"><title>Базовые задачи гостей</title><rect x="0" width="272" height="338" rx="16" fill="white"/><text x="20" y="39" font-size="18" font-weight="600" fill="#252525">Найти место рядом</text><text x="20" y="81" font-size="16" font-weight="400" fill="#252525">Когда мы решаем поужинать</text><text x="20" y="103" font-size="16" font-weight="400" fill="#252525">после работы, я хочу</text><text x="20" y="125" font-size="16" font-weight="400" fill="#252525">увидеть, где рядом есть</text><text x="20" y="147" font-size="16" font-weight="400" fill="#252525">места, чтобы не обходить</text><text x="20" y="169" font-size="16" font-weight="400" fill="#252525">рестораны по очереди.</text><text x="20" y="242" font-size="14" font-weight="400" fill="#616161">В MVP</text><text x="20" y="270" font-size="16" font-weight="400" fill="#252525">Карта и поиск по дате</text><text x="20" y="292" font-size="16" font-weight="400" fill="#252525">и времени</text><rect x="288" width="272" height="338" rx="16" fill="white"/><text x="308" y="39" font-size="18" font-weight="600" fill="#252525">Сравнить варианты</text><text x="308" y="81" font-size="16" font-weight="400" fill="#252525">Когда я выбираю ресторан,</text><text x="308" y="103" font-size="16" font-weight="400" fill="#252525">я хочу сравнить меню, цены</text><text x="308" y="125" font-size="16" font-weight="400" fill="#252525">и свободное время,</text><text x="308" y="147" font-size="16" font-weight="400" fill="#252525">чтобы выбрать, куда пойти.</text><text x="308" y="242" font-size="14" font-weight="400" fill="#616161">В MVP</text><text x="308" y="270" font-size="16" font-weight="400" fill="#252525">Подборки и страница</text><text x="308" y="292" font-size="16" font-weight="400" fill="#252525">ресторана</text><rect x="576" width="272" height="338" rx="16" fill="white"/><text x="596" y="39" font-size="18" font-weight="600" fill="#252525">Собраться компанией</text><text x="596" y="81" font-size="16" font-weight="400" fill="#252525">Когда мы идём с друзьями,</text><text x="596" y="103" font-size="16" font-weight="400" fill="#252525">я хочу найти время,</text><text x="596" y="125" font-size="16" font-weight="400" fill="#252525">в которое нас посадят</text><text x="596" y="147" font-size="16" font-weight="400" fill="#252525">вместе, даже если число</text><text x="596" y="169" font-size="16" font-weight="400" fill="#252525">гостей изменилось.</text><text x="596" y="242" font-size="14" font-weight="400" fill="#616161">В MVP</text><text x="596" y="270" font-size="16" font-weight="400" fill="#252525">Поиск по числу гостей</text><text x="596" y="292" font-size="16" font-weight="400" fill="#252525">и времени визита</text></svg>