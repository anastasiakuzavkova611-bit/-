<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450"><title>JTBD на основе интервью</title><rect x="4" y="8" width="284" height="209" rx="16" fill="white"/><text fill="#252525" font-family="Arial, sans-serif" font-size="17"><tspan x="24" y="70.5">Когда я решаю поесть вне</tspan><tspan x="24" y="94.5">дома, я хочу быстро найти</tspan><tspan x="24" y="118.5">свободное место рядом,</tspan><tspan x="24" y="142.5">чтобы не тратить время</tspan><tspan x="24" y="166.5">на звонки и обход ресторанов</tspan></text><rect x="304" y="8" width="284" height="209" rx="16" fill="white"/><text fill="#252525" font-family="Arial, sans-serif" font-size="17"><tspan x="324" y="70.5">Когда мы идём в ресторан</tspan><tspan x="324" y="94.5">компанией, я хочу найти</tspan><tspan x="324" y="118.5">место, где мы сядем вместе,</tspan><tspan x="324" y="142.5">чтобы спокойно провести</tspan><tspan x="324" y="166.5">время с друзьями</tspan></text><rect x="604" y="8" width="284" height="209" rx="16" fill="white"/><text fill="#252525" font-family="Arial, sans-serif" font-size="17"><tspan x="624" y="70.5">Когда я иду в ресторан</tspan><tspan x="624" y="94.5">с ребёнком, я хочу заранее</tspan><tspan x="624" y="118.5">узнать, есть ли детский</tspan><tspan x="624" y="142.5">стул и место для коляски,</tspan><tspan x="624" y="166.5">чтобы всем было удобно</tspan></text><rect x="4" y="233" width="284" height="209" rx="16" fill="white"/><text fill="#252525" font-family="Arial, sans-serif" font-size="17"><tspan x="24" y="295.5">Когда я планирую важный</tspan><tspan x="24" y="319.5">ужин, я хочу выбрать тихое</tspan><tspan x="24" y="343.5">и удобное место, чтобы</tspan><tspan x="24" y="367.5">спокойно поговорить</tspan><tspan x="24" y="391.5">и не просить пересадить нас</tspan></text><rect x="304" y="233" width="284" height="209" rx="16" fill="white"/><text fill="#252525" font-family="Arial, sans-serif" font-size="17"><tspan x="324" y="283.5">Когда ресторан просит</tspan><tspan x="324" y="307.5">депозит, я хочу заранее</tspan><tspan x="324" y="331.5">понять условия возврата,</tspan><tspan x="324" y="355.5">чтобы знать, что будет</tspan><tspan x="324" y="379.5">с деньгами, если планы</tspan><tspan x="324" y="403.5">изменятся</tspan></text><rect x="604" y="233" width="284" height="209" rx="16" fill="white"/><text fill="#252525" font-family="Arial, sans-serif" font-size="17"><tspan x="624" y="295.5">Когда я выбираю ресторан,</tspan><tspan x="624" y="319.5">я хочу сравнить меню, цены</tspan><tspan x="624" y="343.5">и свободное время, чтобы</tspan><tspan x="624" y="367.5">найти подходящий вариант</tspan><tspan x="624" y="391.5">без долгих поисков</tspan></text></svg>