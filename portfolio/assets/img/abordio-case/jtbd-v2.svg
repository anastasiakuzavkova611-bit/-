<svg xmlns="http://www.w3.org/2000/svg" width="848" height="401" viewBox="0 0 848 401"><title>JTBD на основе интервью</title><rect x="0" y="0.0" width="272" height="192.5" rx="16" fill="white"/><text fill="#252525" font-family="Arial, sans-serif" font-size="16"><tspan x="20" y="55.75">Когда я решаю поесть вне</tspan><tspan x="20" y="78.75">дома, я хочу быстро найти</tspan><tspan x="20" y="101.75">свободное место рядом,</tspan><tspan x="20" y="124.75">чтобы не тратить время</tspan><tspan x="20" y="147.75">на звонки и обход ресторанов</tspan></text><rect x="288" y="0.0" width="272" height="192.5" rx="16" fill="white"/><text fill="#252525" font-family="Arial, sans-serif" font-size="16"><tspan x="308" y="55.75">Когда мы идём в ресторан</tspan><tspan x="308" y="78.75">компанией, я хочу найти</tspan><tspan x="308" y="101.75">место, где мы сядем вместе,</tspan><tspan x="308" y="124.75">чтобы спокойно провести</tspan><tspan x="308" y="147.75">время с друзьями</tspan></text><rect x="576" y="0.0" width="272" height="192.5" rx="16" fill="white"/><text fill="#252525" font-family="Arial, sans-serif" font-size="16"><tspan x="596" y="55.75">Когда я иду в ресторан</tspan><tspan x="596" y="78.75">с ребёнком, я хочу заранее</tspan><tspan x="596" y="101.75">узнать, есть ли детский</tspan><tspan x="596" y="124.75">стул и место для коляски,</tspan><tspan x="596" y="147.75">чтобы всем было удобно</tspan></text><rect x="0" y="208.5" width="272" height="192.5" rx="16" fill="white"/><text fill="#252525" font-family="Arial, sans-serif" font-size="16"><tspan x="20" y="264.25">Когда я планирую важный</tspan><tspan x="20" y="287.25">ужин, я хочу выбрать тихое</tspan><tspan x="20" y="310.25">и удобное место, чтобы</tspan><tspan x="20" y="333.25">спокойно поговорить</tspan><tspan x="20" y="356.25">и не просить пересадить нас</tspan></text><rect x="288" y="208.5" width="272" height="192.5" rx="16" fill="white"/><text fill="#252525" font-family="Arial, sans-serif" font-size="16"><tspan x="308" y="252.75">Когда ресторан просит</tspan><tspan x="308" y="275.75">депозит, я хочу заранее</tspan><tspan x="308" y="298.75">понять условия возврата,</tspan><tspan x="308" y="321.75">чтобы знать, что будет</tspan><tspan x="308" y="344.75">с деньгами, если планы</tspan><tspan x="308" y="367.75">изменятся</tspan></text><rect x="576" y="208.5" width="272" height="192.5" rx="16" fill="white"/><text fill="#252525" font-family="Arial, sans-serif" font-size="16"><tspan x="596" y="264.25">Когда я выбираю ресторан,</tspan><tspan x="596" y="287.25">я хочу сравнить меню, цены</tspan><tspan x="596" y="310.25">и свободное время, чтобы</tspan><tspan x="596" y="333.25">найти подходящий вариант</tspan><tspan x="596" y="356.25">без долгих поисков</tspan></text></svg>