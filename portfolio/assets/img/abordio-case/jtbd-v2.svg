<svg xmlns="http://www.w3.org/2000/svg" width="848" height="326" viewBox="0 0 848 326"><title>JTBD на основе интервью</title><rect x="0" y="0" width="272" height="155" rx="16" fill="white"/><text fill="#252525" font-family="Arial, sans-serif" font-size="16"><tspan x="20" y="35">Когда я решаю поесть вне</tspan><tspan x="20" y="58">дома, я хочу быстро найти</tspan><tspan x="20" y="81">свободное место рядом,</tspan><tspan x="20" y="104">чтобы не тратить время</tspan><tspan x="20" y="127">на звонки и обход ресторанов</tspan></text><rect x="288" y="0" width="272" height="155" rx="16" fill="white"/><text fill="#252525" font-family="Arial, sans-serif" font-size="16"><tspan x="308" y="35">Когда мы идём в ресторан</tspan><tspan x="308" y="58">компанией, я хочу найти</tspan><tspan x="308" y="81">место, где мы сядем вместе,</tspan><tspan x="308" y="104">чтобы спокойно провести</tspan><tspan x="308" y="127">время с друзьями</tspan></text><rect x="576" y="0" width="272" height="155" rx="16" fill="white"/><text fill="#252525" font-family="Arial, sans-serif" font-size="16"><tspan x="596" y="35">Когда я иду в ресторан</tspan><tspan x="596" y="58">с ребёнком, я хочу заранее</tspan><tspan x="596" y="81">узнать, есть ли детский</tspan><tspan x="596" y="104">стул и место для коляски,</tspan><tspan x="596" y="127">чтобы всем было удобно</tspan></text><rect x="0" y="171" width="272" height="155" rx="16" fill="white"/><text fill="#252525" font-family="Arial, sans-serif" font-size="16"><tspan x="20" y="206">Когда я планирую важный</tspan><tspan x="20" y="229">ужин, я хочу выбрать тихое</tspan><tspan x="20" y="252">и удобное место, чтобы</tspan><tspan x="20" y="275">спокойно поговорить</tspan><tspan x="20" y="298">и не просить пересадить нас</tspan></text><rect x="288" y="171" width="272" height="155" rx="16" fill="white"/><text fill="#252525" font-family="Arial, sans-serif" font-size="16"><tspan x="308" y="206">Когда для брони нужен</tspan><tspan x="308" y="229">депозит, я хочу знать</tspan><tspan x="308" y="252">условия возврата, чтобы</tspan><tspan x="308" y="275">понимать, вернутся ли деньги,</tspan><tspan x="308" y="298">если планы изменятся</tspan></text><rect x="576" y="171" width="272" height="155" rx="16" fill="white"/><text fill="#252525" font-family="Arial, sans-serif" font-size="16"><tspan x="596" y="206">Когда я выбираю ресторан,</tspan><tspan x="596" y="229">я хочу сравнить меню, цены</tspan><tspan x="596" y="252">и свободное время, чтобы</tspan><tspan x="596" y="275">найти подходящий вариант</tspan><tspan x="596" y="298">без долгих поисков</tspan></text></svg>