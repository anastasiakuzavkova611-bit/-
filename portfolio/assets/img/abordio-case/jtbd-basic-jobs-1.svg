<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 338" width="848" height="338" font-family="Arial, sans-serif">
<rect x="0" width="272" height="338" rx="16" fill="white"/>
<text x="20" y="39" font-size="18" font-weight="600" fill="#252525">Найти стол рядом</text>
<text x="20" y="71" font-size="16" font-weight="400" fill="#252525">Когда мы решаем поесть вне</text>
<text x="20" y="93" font-size="16" font-weight="400" fill="#252525">дома, я хочу найти ресторан</text>
<text x="20" y="115" font-size="16" font-weight="400" fill="#252525">рядом со свободными</text>
<text x="20" y="137" font-size="16" font-weight="400" fill="#252525">столами, чтобы не обходить</text>
<text x="20" y="159" font-size="16" font-weight="400" fill="#252525">несколько заведений.</text>
<text x="20" y="262" font-size="14" font-weight="400" fill="#616161">В MVP</text>
<text x="20" y="292" font-size="16" font-weight="400" fill="#252525">Карта и поиск ресторанов</text>
<rect x="288" width="272" height="338" rx="16" fill="white"/>
<text x="308" y="39" font-size="18" font-weight="600" fill="#252525">Спланировать встречу</text>
<text x="308" y="71" font-size="16" font-weight="400" fill="#252525">Когда я планирую встречу</text>
<text x="308" y="93" font-size="16" font-weight="400" fill="#252525">заранее, я хочу найти</text>
<text x="308" y="115" font-size="16" font-weight="400" fill="#252525">ресторан на нужную дату,</text>
<text x="308" y="137" font-size="16" font-weight="400" fill="#252525">время и количество гостей,</text>
<text x="308" y="159" font-size="16" font-weight="400" fill="#252525">чтобы выбрать из вариантов,</text>
<text x="308" y="181" font-size="16" font-weight="400" fill="#252525">которые нам действительно</text>
<text x="308" y="203" font-size="16" font-weight="400" fill="#252525">подходят.</text>
<text x="308" y="262" font-size="14" font-weight="400" fill="#616161">В MVP</text>
<text x="308" y="292" font-size="16" font-weight="400" fill="#252525">Дата, время и число гостей</text>
<rect x="576" width="272" height="338" rx="16" fill="white"/>
<text x="596" y="39" font-size="18" font-weight="600" fill="#252525">Сравнить рестораны</text>
<text x="596" y="71" font-size="16" font-weight="400" fill="#252525">Когда я выбираю</text>
<text x="596" y="93" font-size="16" font-weight="400" fill="#252525">между несколькими</text>
<text x="596" y="115" font-size="16" font-weight="400" fill="#252525">ресторанами, я хочу сравнить</text>
<text x="596" y="137" font-size="16" font-weight="400" fill="#252525">меню, цены, фотографии</text>
<text x="596" y="159" font-size="16" font-weight="400" fill="#252525">и отзывы, чтобы понять, какой</text>
<text x="596" y="181" font-size="16" font-weight="400" fill="#252525">больше подходит для нашей</text>
<text x="596" y="203" font-size="16" font-weight="400" fill="#252525">встречи.</text>
<text x="596" y="262" font-size="14" font-weight="400" fill="#616161">В MVP</text>
<text x="596" y="292" font-size="16" font-weight="400" fill="#252525">Страница ресторана</text>
</svg>
