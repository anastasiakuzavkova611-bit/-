<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 338" width="848" height="338" font-family="Arial, sans-serif"><title>Дополнительные задачи гостей</title><rect x="0" width="272" height="338" rx="16" fill="white"/><text x="20" y="39" font-size="18" font-weight="600" fill="#252525">Выбрать тихое место</text><text x="20" y="81" font-size="16" font-weight="400" fill="#252525">Когда я планирую встречу,</text><text x="20" y="103" font-size="16" font-weight="400" fill="#252525">я хочу заранее выбрать</text><text x="20" y="125" font-size="16" font-weight="400" fill="#252525">стол подальше от прохода,</text><text x="20" y="147" font-size="16" font-weight="400" fill="#252525">чтобы спокойно поговорить.</text><text x="20" y="242" font-size="14" font-weight="400" fill="#616161">В MVP</text><text x="20" y="270" font-size="16" font-weight="400" fill="#252525">Выбор конкретного стола</text><text x="20" y="292" font-size="16" font-weight="400" fill="#252525">на плане зала</text><rect x="288" width="272" height="338" rx="16" fill="white"/><text x="308" y="39" font-size="18" font-weight="600" fill="#252525">Прийти с ребёнком</text><text x="308" y="81" font-size="16" font-weight="400" fill="#252525">Когда мы идём в ресторан</text><text x="308" y="103" font-size="16" font-weight="400" fill="#252525">с ребёнком, я хочу знать,</text><text x="308" y="125" font-size="16" font-weight="400" fill="#252525">где поместится коляска</text><text x="308" y="147" font-size="16" font-weight="400" fill="#252525">и есть ли детский стул,</text><text x="308" y="169" font-size="16" font-weight="400" fill="#252525">чтобы не уточнять это</text><text x="308" y="191" font-size="16" font-weight="400" fill="#252525">по телефону.</text><text x="308" y="242" font-size="14" font-weight="400" fill="#616161">Для проверки</text><text x="308" y="270" font-size="16" font-weight="400" fill="#252525">Какие сведения о месте</text><text x="308" y="292" font-size="16" font-weight="400" fill="#252525">нужны помимо плана зала</text><rect x="576" width="272" height="338" rx="16" fill="white"/><text x="596" y="39" font-size="18" font-weight="600" fill="#252525">Понять условия отмены</text><text x="596" y="81" font-size="16" font-weight="400" fill="#252525">Когда ресторан просит</text><text x="596" y="103" font-size="16" font-weight="400" fill="#252525">депозит, я хочу знать,</text><text x="596" y="125" font-size="16" font-weight="400" fill="#252525">до какого момента его</text><text x="596" y="147" font-size="16" font-weight="400" fill="#252525">вернут, чтобы решить,</text><text x="596" y="169" font-size="16" font-weight="400" fill="#252525">готова ли я платить</text><text x="596" y="191" font-size="16" font-weight="400" fill="#252525">заранее.</text><text x="596" y="242" font-size="14" font-weight="400" fill="#616161">В MVP</text><text x="596" y="270" font-size="16" font-weight="400" fill="#252525">Сумма депозита и условия</text><text x="596" y="292" font-size="16" font-weight="400" fill="#252525">возврата до оплаты</text></svg>