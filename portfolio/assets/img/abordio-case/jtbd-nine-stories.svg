<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 962 656" width="962" height="656" font-family="Arial, sans-serif">
<title>JTBD на основе интервью</title>
<rect width="100%" height="100%" fill="#f4f4f4"/>
<rect x="0" y="0" width="310" height="208" rx="16" fill="#fff"/>
<text x="20" y="38" font-size="18" fill="#252525">Когда мы решаем поесть вне</text>
<text x="20" y="62" font-size="18" fill="#252525">дома, я хочу увидеть, в каких</text>
<text x="20" y="86" font-size="18" fill="#252525">ресторанах поблизости есть</text>
<text x="20" y="110" font-size="18" fill="#252525">место на всю компанию, чтобы</text>
<text x="20" y="134" font-size="18" fill="#252525">быстро договориться, куда</text>
<text x="20" y="158" font-size="18" fill="#252525">пойти.</text>
<rect x="326" y="0" width="310" height="208" rx="16" fill="#fff"/>
<text x="346" y="38" font-size="18" fill="#252525">Когда у меня мало времени</text>
<text x="346" y="62" font-size="18" fill="#252525">между делами, я хочу</text>
<text x="346" y="86" font-size="18" fill="#252525">забронировать стол рядом к</text>
<text x="346" y="110" font-size="18" fill="#252525">определённому часу, чтобы по</text>
<text x="346" y="134" font-size="18" fill="#252525">приходу сразу сесть.</text>
<rect x="652" y="0" width="310" height="208" rx="16" fill="#fff"/>
<text x="672" y="38" font-size="18" fill="#252525">Когда я уже выбрал ресторан и</text>
<text x="672" y="62" font-size="18" fill="#252525">открыл его карточку, я хочу</text>
<text x="672" y="86" font-size="18" fill="#252525">сразу проверить свободное</text>
<text x="672" y="110" font-size="18" fill="#252525">время и забронировать стол,</text>
<text x="672" y="134" font-size="18" fill="#252525">чтобы не возвращаться к</text>
<text x="672" y="158" font-size="18" fill="#252525">поиску.</text>
<rect x="0" y="224" width="310" height="208" rx="16" fill="#fff"/>
<text x="20" y="262" font-size="18" fill="#252525">Когда на подходящий стол</text>
<text x="20" y="286" font-size="18" fill="#252525">действует скидка, я хочу до</text>
<text x="20" y="310" font-size="18" fill="#252525">бронирования узнать, в какое</text>
<text x="20" y="334" font-size="18" fill="#252525">время и на что она</text>
<text x="20" y="358" font-size="18" fill="#252525">распространяется, чтобы</text>
<text x="20" y="382" font-size="18" fill="#252525">понимать, на какую сумму</text>
<text x="20" y="406" font-size="18" fill="#252525">рассчитывать.</text>
<rect x="326" y="224" width="310" height="208" rx="16" fill="#fff"/>
<text x="346" y="262" font-size="18" fill="#252525">Когда я бронирую стол на день</text>
<text x="346" y="286" font-size="18" fill="#252525">рождения, годовщину или</text>
<text x="346" y="310" font-size="18" fill="#252525">другое событие, я хочу</text>
<text x="346" y="334" font-size="18" fill="#252525">отметить повод и оставить</text>
<text x="346" y="358" font-size="18" fill="#252525">пожелание, чтобы ресторан мог</text>
<text x="346" y="382" font-size="18" fill="#252525">подготовиться к нашему визиту.</text>
<rect x="652" y="224" width="310" height="208" rx="16" fill="#fff"/>
<text x="672" y="262" font-size="18" fill="#252525">Когда ресторан просит депозит,</text>
<text x="672" y="286" font-size="18" fill="#252525">я хочу понять, зачем он нужен,</text>
<text x="672" y="310" font-size="18" fill="#252525">сколько нужно внести за всю</text>
<text x="672" y="334" font-size="18" fill="#252525">компанию и до какого момента</text>
<text x="672" y="358" font-size="18" fill="#252525">его вернут полностью, чтобы</text>
<text x="672" y="382" font-size="18" fill="#252525">решить, подходят ли мне</text>
<text x="672" y="406" font-size="18" fill="#252525">условия.</text>
<rect x="163" y="448" width="310" height="208" rx="16" fill="#fff"/>
<text x="183" y="486" font-size="18" fill="#252525">Когда приближается время</text>
<text x="183" y="510" font-size="18" fill="#252525">брони, я хочу получить</text>
<text x="183" y="534" font-size="18" fill="#252525">напоминание с адресом и</text>
<text x="183" y="558" font-size="18" fill="#252525">временем, чтобы успеть к</text>
<text x="183" y="582" font-size="18" fill="#252525">началу встречи.</text>
<rect x="489" y="448" width="310" height="208" rx="16" fill="#fff"/>
<text x="509" y="486" font-size="18" fill="#252525">Когда я хочу снова пойти туда,</text>
<text x="509" y="510" font-size="18" fill="#252525">где мне понравилось, я хочу</text>
<text x="509" y="534" font-size="18" fill="#252525">найти ресторан в истории</text>
<text x="509" y="558" font-size="18" fill="#252525">броней, чтобы быстро</text>
<text x="509" y="582" font-size="18" fill="#252525">забронировать стол на новую</text>
<text x="509" y="606" font-size="18" fill="#252525">дату.</text>
</svg>
