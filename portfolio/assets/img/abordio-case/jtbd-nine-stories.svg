<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1232 656" width="1232" height="656" font-family="Arial, sans-serif">
<title>JTBD на основе интервью</title>
<rect width="100%" height="100%" fill="#f4f4f4"/>
<rect x="0" y="0" width="400" height="208" rx="16" fill="#fff"/>
<text x="20" y="39" font-size="20" fill="#252525">Когда мы решаем поесть вне дома, я</text>
<text x="20" y="65" font-size="20" fill="#252525">хочу увидеть, в каких ресторанах</text>
<text x="20" y="91" font-size="20" fill="#252525">поблизости есть место на всю</text>
<text x="20" y="117" font-size="20" fill="#252525">компанию, чтобы быстро</text>
<text x="20" y="143" font-size="20" fill="#252525">договориться, куда пойти.</text>
<rect x="416" y="0" width="400" height="208" rx="16" fill="#fff"/>
<text x="436" y="39" font-size="20" fill="#252525">Когда у меня мало времени между</text>
<text x="436" y="65" font-size="20" fill="#252525">делами, я хочу забронировать стол</text>
<text x="436" y="91" font-size="20" fill="#252525">рядом к определённому часу, чтобы</text>
<text x="436" y="117" font-size="20" fill="#252525">по приходу сразу сесть.</text>
<rect x="832" y="0" width="400" height="208" rx="16" fill="#fff"/>
<text x="852" y="39" font-size="20" fill="#252525">Когда я уже выбрал ресторан и</text>
<text x="852" y="65" font-size="20" fill="#252525">открыл его карточку, я хочу сразу</text>
<text x="852" y="91" font-size="20" fill="#252525">проверить свободное время и</text>
<text x="852" y="117" font-size="20" fill="#252525">забронировать стол, чтобы не</text>
<text x="852" y="143" font-size="20" fill="#252525">возвращаться к поиску.</text>
<rect x="0" y="224" width="400" height="208" rx="16" fill="#fff"/>
<text x="20" y="263" font-size="20" fill="#252525">Когда на подходящий стол действует</text>
<text x="20" y="289" font-size="20" fill="#252525">скидка, я хочу до бронирования</text>
<text x="20" y="315" font-size="20" fill="#252525">узнать, в какое время и на что она</text>
<text x="20" y="341" font-size="20" fill="#252525">распространяется, чтобы понимать,</text>
<text x="20" y="367" font-size="20" fill="#252525">на какую сумму рассчитывать.</text>
<rect x="416" y="224" width="400" height="208" rx="16" fill="#fff"/>
<text x="436" y="263" font-size="20" fill="#252525">Когда я бронирую стол на день</text>
<text x="436" y="289" font-size="20" fill="#252525">рождения, годовщину или другое</text>
<text x="436" y="315" font-size="20" fill="#252525">событие, я хочу отметить повод и</text>
<text x="436" y="341" font-size="20" fill="#252525">оставить пожелание, чтобы ресторан</text>
<text x="436" y="367" font-size="20" fill="#252525">мог подготовиться к нашему визиту.</text>
<rect x="832" y="224" width="400" height="208" rx="16" fill="#fff"/>
<text x="852" y="263" font-size="20" fill="#252525">Когда ресторан просит депозит, я</text>
<text x="852" y="289" font-size="20" fill="#252525">хочу понять, зачем он нужен, сколько</text>
<text x="852" y="315" font-size="20" fill="#252525">нужно внести за всю компанию и до</text>
<text x="852" y="341" font-size="20" fill="#252525">какого момента его вернут</text>
<text x="852" y="367" font-size="20" fill="#252525">полностью, чтобы решить, подходят</text>
<text x="852" y="393" font-size="20" fill="#252525">ли мне условия.</text>
<rect x="208" y="448" width="400" height="208" rx="16" fill="#fff"/>
<text x="228" y="487" font-size="20" fill="#252525">Когда приближается время брони, я</text>
<text x="228" y="513" font-size="20" fill="#252525">хочу получить напоминание с</text>
<text x="228" y="539" font-size="20" fill="#252525">адресом и временем, чтобы успеть к</text>
<text x="228" y="565" font-size="20" fill="#252525">началу встречи.</text>
<rect x="624" y="448" width="400" height="208" rx="16" fill="#fff"/>
<text x="644" y="487" font-size="20" fill="#252525">Когда я хочу снова пойти туда, где</text>
<text x="644" y="513" font-size="20" fill="#252525">мне понравилось, я хочу найти</text>
<text x="644" y="539" font-size="20" fill="#252525">ресторан в истории броней, чтобы</text>
<text x="644" y="565" font-size="20" fill="#252525">быстро забронировать стол на новую</text>
<text x="644" y="591" font-size="20" fill="#252525">дату.</text>
</svg>
