<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 962 656" width="962" height="656" font-family="Arial, sans-serif">
<title>JTBD на основе интервью</title>
<rect width="100%" height="100%" fill="#f4f4f4"/>
<rect x="0" y="0" width="310" height="208" rx="16" fill="#fff"/>
<text x="20" y="38" font-size="18" fill="#252525">Когда мы решаем поесть</text>
<text x="20" y="62" font-size="18" fill="#252525">вне дома, я хочу найти</text>
<text x="20" y="86" font-size="18" fill="#252525">свободный стол в ресторане</text>
<text x="20" y="110" font-size="18" fill="#252525">рядом, чтобы было недалеко.</text>
<rect x="326" y="0" width="310" height="208" rx="16" fill="#fff"/>
<text x="346" y="38" font-size="18" fill="#252525">Когда у меня мало времени,</text>
<text x="346" y="62" font-size="18" fill="#252525">я хочу забронировать</text>
<text x="346" y="86" font-size="18" fill="#252525">конкретный стол на удобное</text>
<text x="346" y="110" font-size="18" fill="#252525">время, чтобы не тратить время</text>
<text x="346" y="134" font-size="18" fill="#252525">на ожидание посадки.</text>
<rect x="652" y="0" width="310" height="208" rx="16" fill="#fff"/>
<text x="672" y="38" font-size="18" fill="#252525">Когда мне важно, где мы будем</text>
<text x="672" y="62" font-size="18" fill="#252525">сидеть, я хочу заранее выбрать</text>
<text x="672" y="86" font-size="18" fill="#252525">конкретный стол, чтобы потом</text>
<text x="672" y="110" font-size="18" fill="#252525">не просить нас пересадить.</text>
<rect x="0" y="224" width="310" height="208" rx="16" fill="#fff"/>
<text x="20" y="262" font-size="18" fill="#252525">Когда на подходящий стол</text>
<text x="20" y="286" font-size="18" fill="#252525">действует скидка, я хочу понять</text>
<text x="20" y="310" font-size="18" fill="#252525">её условия до бронирования,</text>
<text x="20" y="334" font-size="18" fill="#252525">чтобы знать,</text>
<text x="20" y="358" font-size="18" fill="#252525">на что рассчитывать</text>
<text x="20" y="382" font-size="18" fill="#252525">при оплате счёта.</text>
<rect x="326" y="224" width="310" height="208" rx="16" fill="#fff"/>
<text x="346" y="262" font-size="18" fill="#252525">Когда у нашей компании есть</text>
<text x="346" y="286" font-size="18" fill="#252525">пожелания к посещению,</text>
<text x="346" y="310" font-size="18" fill="#252525">я хочу передать их ресторану</text>
<text x="346" y="334" font-size="18" fill="#252525">при бронировании,</text>
<text x="346" y="358" font-size="18" fill="#252525">чтобы сотрудники могли учесть</text>
<text x="346" y="382" font-size="18" fill="#252525">их заранее.</text>
<rect x="652" y="224" width="310" height="208" rx="16" fill="#fff"/>
<text x="672" y="262" font-size="18" fill="#252525">Когда ресторан просит депозит,</text>
<text x="672" y="286" font-size="18" fill="#252525">я хочу до оплаты узнать сумму,</text>
<text x="672" y="310" font-size="18" fill="#252525">причину и условия возврата,</text>
<text x="672" y="334" font-size="18" fill="#252525">чтобы решить, подходят</text>
<text x="672" y="358" font-size="18" fill="#252525">ли мне эти условия.</text>
<rect x="0" y="448" width="310" height="208" rx="16" fill="#fff"/>
<text x="20" y="486" font-size="18" fill="#252525">Когда ресторан не может</text>
<text x="20" y="510" font-size="18" fill="#252525">предоставить</text>
<text x="20" y="534" font-size="18" fill="#252525">уже подтверждённый стол,</text>
<text x="20" y="558" font-size="18" fill="#252525">я хочу сам решить, подходит</text>
<text x="20" y="582" font-size="18" fill="#252525">ли замена, чтобы сохранить</text>
<text x="20" y="606" font-size="18" fill="#252525">визит или отменить бронь</text>
<text x="20" y="630" font-size="18" fill="#252525">с полным возвратом.</text>
<rect x="326" y="448" width="310" height="208" rx="16" fill="#fff"/>
<text x="346" y="486" font-size="18" fill="#252525">Когда приближается время</text>
<text x="346" y="510" font-size="18" fill="#252525">брони, я хочу получить</text>
<text x="346" y="534" font-size="18" fill="#252525">напоминание с адресом,</text>
<text x="346" y="558" font-size="18" fill="#252525">чтобы вовремя прийти</text>
<text x="346" y="582" font-size="18" fill="#252525">в ресторан.</text>
<rect x="652" y="448" width="310" height="208" rx="16" fill="#fff"/>
<text x="672" y="486" font-size="18" fill="#252525">Когда я снова собираюсь</text>
<text x="672" y="510" font-size="18" fill="#252525">в знакомый ресторан, я хочу</text>
<text x="672" y="534" font-size="18" fill="#252525">найти его в истории,</text>
<text x="672" y="558" font-size="18" fill="#252525">чтобы быстро забронировать</text>
<text x="672" y="582" font-size="18" fill="#252525">стол.</text>
</svg>
