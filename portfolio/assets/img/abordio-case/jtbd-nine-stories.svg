<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 962 656" width="962" height="656" font-family="Arial, sans-serif">
<title>JTBD на основе интервью</title>
<rect width="100%" height="100%" fill="#f4f4f4"/>
<rect x="0" y="0" width="310" height="208" rx="16" fill="#fff"/>
<text x="20" y="50" font-size="18" fill="#252525">Когда мы решаем поесть вне</text>
<text x="20" y="74" font-size="18" fill="#252525">дома, я хочу увидеть, в каких</text>
<text x="20" y="98" font-size="18" fill="#252525">ресторанах поблизости есть</text>
<text x="20" y="122" font-size="18" fill="#252525">место на всю компанию, чтобы</text>
<text x="20" y="146" font-size="18" fill="#252525">быстро договориться, куда</text>
<text x="20" y="170" font-size="18" fill="#252525">пойти.</text>
<rect x="326" y="0" width="310" height="208" rx="16" fill="#fff"/>
<text x="346" y="60" font-size="18" fill="#252525">Когда у меня мало времени</text>
<text x="346" y="84" font-size="18" fill="#252525">между делами, я хочу</text>
<text x="346" y="108" font-size="18" fill="#252525">забронировать стол рядом к</text>
<text x="346" y="132" font-size="18" fill="#252525">определённому часу, чтобы по</text>
<text x="346" y="156" font-size="18" fill="#252525">приходу сразу сесть.</text>
<rect x="652" y="0" width="310" height="208" rx="16" fill="#fff"/>
<text x="672" y="48" font-size="18" fill="#252525">Когда я уже выбрал ресторан и</text>
<text x="672" y="72" font-size="18" fill="#252525">открыл его карточку, я хочу</text>
<text x="672" y="96" font-size="18" fill="#252525">сразу проверить свободное</text>
<text x="672" y="120" font-size="18" fill="#252525">время и забронировать стол,</text>
<text x="672" y="144" font-size="18" fill="#252525">чтобы не возвращаться к</text>
<text x="672" y="168" font-size="18" fill="#252525">поиску.</text>
<rect x="0" y="224" width="310" height="208" rx="16" fill="#fff"/>
<text x="20" y="260" font-size="18" fill="#252525">Когда на подходящий стол</text>
<text x="20" y="284" font-size="18" fill="#252525">действует скидка, я хочу до</text>
<text x="20" y="308" font-size="18" fill="#252525">бронирования узнать, в какое</text>
<text x="20" y="332" font-size="18" fill="#252525">время и на что она</text>
<text x="20" y="356" font-size="18" fill="#252525">распространяется, чтобы</text>
<text x="20" y="380" font-size="18" fill="#252525">понимать, на какую сумму</text>
<text x="20" y="404" font-size="18" fill="#252525">рассчитывать.</text>
<rect x="326" y="224" width="310" height="208" rx="16" fill="#fff"/>
<text x="346" y="272" font-size="18" fill="#252525">Когда я бронирую стол на день</text>
<text x="346" y="296" font-size="18" fill="#252525">рождения, годовщину или</text>
<text x="346" y="320" font-size="18" fill="#252525">другое событие, я хочу</text>
<text x="346" y="344" font-size="18" fill="#252525">отметить повод и оставить</text>
<text x="346" y="368" font-size="18" fill="#252525">пожелание, чтобы ресторан мог</text>
<text x="346" y="392" font-size="18" fill="#252525">подготовиться к нашему визиту.</text>
<rect x="652" y="224" width="310" height="208" rx="16" fill="#fff"/>
<text x="672" y="260" font-size="18" fill="#252525">Когда ресторан просит депозит,</text>
<text x="672" y="284" font-size="18" fill="#252525">я хочу понять, зачем он нужен,</text>
<text x="672" y="308" font-size="18" fill="#252525">сколько нужно внести за всю</text>
<text x="672" y="332" font-size="18" fill="#252525">компанию и до какого момента</text>
<text x="672" y="356" font-size="18" fill="#252525">его вернут полностью, чтобы</text>
<text x="672" y="380" font-size="18" fill="#252525">решить, подходят ли мне</text>
<text x="672" y="404" font-size="18" fill="#252525">условия.</text>
<rect x="163" y="448" width="310" height="208" rx="16" fill="#fff"/>
<text x="183" y="508" font-size="18" fill="#252525">Когда приближается время</text>
<text x="183" y="532" font-size="18" fill="#252525">брони, я хочу получить</text>
<text x="183" y="556" font-size="18" fill="#252525">напоминание с адресом и</text>
<text x="183" y="580" font-size="18" fill="#252525">временем, чтобы успеть к</text>
<text x="183" y="604" font-size="18" fill="#252525">началу встречи.</text>
<rect x="489" y="448" width="310" height="208" rx="16" fill="#fff"/>
<text x="509" y="496" font-size="18" fill="#252525">Когда я хочу снова пойти туда,</text>
<text x="509" y="520" font-size="18" fill="#252525">где мне понравилось, я хочу</text>
<text x="509" y="544" font-size="18" fill="#252525">найти ресторан в истории</text>
<text x="509" y="568" font-size="18" fill="#252525">броней, чтобы быстро</text>
<text x="509" y="592" font-size="18" fill="#252525">забронировать стол на новую</text>
<text x="509" y="616" font-size="18" fill="#252525">дату.</text>
</svg>
