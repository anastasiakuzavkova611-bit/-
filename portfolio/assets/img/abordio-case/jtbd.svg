<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450"><rect width="900" height="450" fill="#f4f4f4"/><rect x="4" y="4" width="284" height="209" rx="16" fill="white"/><text x="24" y="36" font-family="Arial,sans-serif" font-size="17" fill="#252525"><tspan x="24" dy="0">Когда я спонтанно ищу</tspan><tspan x="24" dy="24">ресторан, я хочу знать, где</tspan><tspan x="24" dy="24">есть свободные места рядом,</tspan><tspan x="24" dy="24">чтобы не обходить несколько</tspan><tspan x="24" dy="24">полных заведений</tspan></text><rect x="304" y="4" width="284" height="209" rx="16" fill="white"/><text x="324" y="36" font-family="Arial,sans-serif" font-size="17" fill="#252525"><tspan x="324" dy="0">Когда я собираю друзей, я</tspan><tspan x="324" dy="24">хочу согласовать время и</tspan><tspan x="324" dy="24">легко изменить число гостей,</tspan><tspan x="324" dy="24">чтобы не начинать</tspan><tspan x="324" dy="24">бронирование заново</tspan></text><rect x="604" y="4" width="284" height="209" rx="16" fill="white"/><text x="624" y="36" font-family="Arial,sans-serif" font-size="17" fill="#252525"><tspan x="624" dy="0">Когда я иду в ресторан с</tspan><tspan x="624" dy="24">ребёнком, я хочу заранее</tspan><tspan x="624" dy="24">узнать про детский стул и</tspan><tspan x="624" dy="24">место для коляски, чтобы всем</tspan><tspan x="624" dy="24">было удобно</tspan></text><rect x="4" y="229" width="284" height="209" rx="16" fill="white"/><text x="24" y="261" font-family="Arial,sans-serif" font-size="17" fill="#252525"><tspan x="24" dy="0">Когда я планирую важный ужин,</tspan><tspan x="24" dy="24">я хочу понять, насколько</tspan><tspan x="24" dy="24">место тихое и комфортное,</tspan><tspan x="24" dy="24">чтобы посадка не испортила</tspan><tspan x="24" dy="24">впечатление</tspan></text><rect x="304" y="229" width="284" height="209" rx="16" fill="white"/><text x="324" y="261" font-family="Arial,sans-serif" font-size="17" fill="#252525"><tspan x="324" dy="0">Когда для брони нужен</tspan><tspan x="324" dy="24">депозит, я хочу заранее</tspan><tspan x="324" dy="24">узнать сумму и условия</tspan><tspan x="324" dy="24">возврата, чтобы понимать</tspan><tspan x="324" dy="24">последствия изменения планов</tspan></text><rect x="604" y="229" width="284" height="209" rx="16" fill="white"/><text x="624" y="261" font-family="Arial,sans-serif" font-size="17" fill="#252525"><tspan x="624" dy="0">Когда я выбираю между</tspan><tspan x="624" dy="24">ресторанами, я хочу сравнить</tspan><tspan x="624" dy="24">меню, цены и доступное время,</tspan><tspan x="624" dy="24">чтобы принять решение без</tspan><tspan x="624" dy="24">множества вкладок</tspan></text></svg>