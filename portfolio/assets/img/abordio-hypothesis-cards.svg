<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="586" viewBox="0 0 1120 586" font-family="Arial, sans-serif">
<title>Продуктовые гипотезы</title>
<rect width="100%" height="100%" fill="#f4f4f4"/>
<rect x="0" y="0" width="362" height="184" rx="16" fill="#fff"/>
<text x="20" y="37" font-size="17" fill="#252525">Если показать на карте ближайшие</text>
<text x="20" y="61" font-size="17" fill="#252525">рестораны, где сейчас есть свободный</text>
<text x="20" y="85" font-size="17" fill="#252525">стол, гость быстрее найдёт место</text>
<text x="20" y="109" font-size="17" fill="#252525">для спонтанного ужина.</text>
<rect x="379" y="0" width="362" height="184" rx="16" fill="#fff"/>
<text x="399" y="37" font-size="17" fill="#252525">Если стол закрепляется за гостем</text>
<text x="399" y="61" font-size="17" fill="#252525">к выбранному времени и ресторан</text>
<text x="399" y="85" font-size="17" fill="#252525">видит эту бронь, гостю придётся</text>
<text x="399" y="109" font-size="17" fill="#252525">меньше ждать на месте.</text>
<rect x="758" y="0" width="362" height="184" rx="16" fill="#fff"/>
<text x="778" y="37" font-size="17" fill="#252525">Если при бронировании можно выбрать</text>
<text x="778" y="61" font-size="17" fill="#252525">стол на плане зала и увидеть,</text>
<text x="778" y="85" font-size="17" fill="#252525">где он расположен, гости, которым</text>
<text x="778" y="109" font-size="17" fill="#252525">важно место, будут реже просить о</text>
<text x="778" y="133" font-size="17" fill="#252525">пересадке.</text>
<rect x="0" y="201" width="362" height="184" rx="16" fill="#fff"/>
<text x="20" y="238" font-size="17" fill="#252525">Если рядом со столом указать размер</text>
<text x="20" y="262" font-size="17" fill="#252525">скидки, а до подтверждения объяснить,</text>
<text x="20" y="286" font-size="17" fill="#252525">на какие позиции и время она</text>
<text x="20" y="310" font-size="17" fill="#252525">действует, гость сможет заранее</text>
<text x="20" y="334" font-size="17" fill="#252525">понять, сколько сэкономит.</text>
<rect x="379" y="201" width="362" height="184" rx="16" fill="#fff"/>
<text x="399" y="238" font-size="17" fill="#252525">Если гость может оставить пожелание</text>
<text x="399" y="262" font-size="17" fill="#252525">при бронировании, а сотрудники увидят</text>
<text x="399" y="286" font-size="17" fill="#252525">его вместе с бронью, гостю реже</text>
<text x="399" y="310" font-size="17" fill="#252525">придётся отдельно звонить в ресторан.</text>
<rect x="758" y="201" width="362" height="184" rx="16" fill="#fff"/>
<text x="778" y="238" font-size="17" fill="#252525">Если до оплаты показать сумму</text>
<text x="778" y="262" font-size="17" fill="#252525">депозита, причину и крайний срок</text>
<text x="778" y="286" font-size="17" fill="#252525">отмены с полным возвратом, гостю</text>
<text x="778" y="310" font-size="17" fill="#252525">будет проще решить, готов</text>
<text x="778" y="334" font-size="17" fill="#252525">ли он бронировать.</text>
<rect x="0" y="402" width="362" height="184" rx="16" fill="#fff"/>
<text x="20" y="439" font-size="17" fill="#252525">Если ресторан покажет, какой стол</text>
<text x="20" y="463" font-size="17" fill="#252525">предлагает взамен, и даст гостю выбор</text>
<text x="20" y="487" font-size="17" fill="#252525">между заменой и отменой с полным</text>
<text x="20" y="511" font-size="17" fill="#252525">возвратом депозита, гость сможет</text>
<text x="20" y="535" font-size="17" fill="#252525">решить, сохранять ли визит, без звонка</text>
<text x="20" y="559" font-size="17" fill="#252525">в ресторан.</text>
<rect x="379" y="402" width="362" height="184" rx="16" fill="#fff"/>
<text x="399" y="439" font-size="17" fill="#252525">Если перед визитом прислать</text>
<text x="399" y="463" font-size="17" fill="#252525">напоминание со временем брони</text>
<text x="399" y="487" font-size="17" fill="#252525">и адресом, гостю будет проще вовремя</text>
<text x="399" y="511" font-size="17" fill="#252525">добраться до ресторана.</text>
<rect x="758" y="402" width="362" height="184" rx="16" fill="#fff"/>
<text x="778" y="439" font-size="17" fill="#252525">Если из истории посещений можно</text>
<text x="778" y="463" font-size="17" fill="#252525">сразу перейти к новой брони в том же</text>
<text x="778" y="487" font-size="17" fill="#252525">ресторане, гость забронирует знакомое</text>
<text x="778" y="511" font-size="17" fill="#252525">место быстрее.</text>
</svg>
