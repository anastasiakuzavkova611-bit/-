<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1232 656" width="1232" height="656" font-family="Arial, sans-serif">
<title>Продуктовые гипотезы</title>

<rect x="0" y="0" width="400" height="208" rx="16" fill="#fff"/>
<text x="20" y="39" font-size="20" fill="#252525">Если на карте показывать ближайшие</text>
<text x="20" y="65" font-size="20" fill="#252525">рестораны со свободным столом,</text>
<text x="20" y="91" font-size="20" fill="#252525">сократится время от начала поиска</text>
<text x="20" y="117" font-size="20" fill="#252525">до выбора ресторана.</text>
<rect x="416" y="0" width="400" height="208" rx="16" fill="#fff"/>
<text x="436" y="39" font-size="20" fill="#252525">Если гость заранее выбирает</text>
<text x="436" y="65" font-size="20" fill="#252525">конкретный стол, время от прихода</text>
<text x="436" y="91" font-size="20" fill="#252525">до посадки будет меньше,</text>
<text x="436" y="117" font-size="20" fill="#252525">чем при бронировании без выбора</text>
<text x="436" y="143" font-size="20" fill="#252525">стола.</text>
<rect x="832" y="0" width="400" height="208" rx="16" fill="#fff"/>
<text x="852" y="39" font-size="20" fill="#252525">Если нажатие на свободное время</text>
<text x="852" y="65" font-size="20" fill="#252525">в карточке ресторана открывает</text>
<text x="852" y="91" font-size="20" fill="#252525">бронь на этот час, вырастет</text>
<text x="852" y="117" font-size="20" fill="#252525">конверсия из просмотра карточки</text>
<text x="852" y="143" font-size="20" fill="#252525">в подтверждённую бронь.</text>
<rect x="0" y="224" width="400" height="208" rx="16" fill="#fff"/>
<text x="20" y="263" font-size="20" fill="#252525">Если при выборе стола гость увидит</text>
<text x="20" y="289" font-size="20" fill="#252525">размер скидки, время её действия</text>
<text x="20" y="315" font-size="20" fill="#252525">и описание, снизится доля броней,</text>
<text x="20" y="341" font-size="20" fill="#252525">по которым гости обращаются</text>
<text x="20" y="367" font-size="20" fill="#252525">в ресторан за уточнением условий</text>
<text x="20" y="393" font-size="20" fill="#252525">скидки.</text>
<rect x="416" y="224" width="400" height="208" rx="16" fill="#fff"/>
<text x="436" y="263" font-size="20" fill="#252525">Если гость может указать повод</text>
<text x="436" y="289" font-size="20" fill="#252525">для визита при бронировании,</text>
<text x="436" y="315" font-size="20" fill="#252525">снизится доля броней, по которым</text>
<text x="436" y="341" font-size="20" fill="#252525">гости отдельно звонят или пишут</text>
<text x="436" y="367" font-size="20" fill="#252525">в ресторан, чтобы сообщить</text>
<text x="436" y="393" font-size="20" fill="#252525">о событии.</text>
<rect x="832" y="224" width="400" height="208" rx="16" fill="#fff"/>
<text x="852" y="263" font-size="20" fill="#252525">Если до оплаты объяснить</text>
<text x="852" y="289" font-size="20" fill="#252525">назначение депозита, показать сумму</text>
<text x="852" y="315" font-size="20" fill="#252525">за всю компанию и срок полного</text>
<text x="852" y="341" font-size="20" fill="#252525">возврата, снизится доля гостей,</text>
<text x="852" y="367" font-size="20" fill="#252525">которым нужно уточнить условия</text>
<text x="852" y="393" font-size="20" fill="#252525">у ресторана.</text>
<rect x="208" y="448" width="400" height="208" rx="16" fill="#fff"/>
<text x="228" y="487" font-size="20" fill="#252525">Если перед визитом напомнить гостю</text>
<text x="228" y="513" font-size="20" fill="#252525">время брони и адрес ресторана,</text>
<text x="228" y="539" font-size="20" fill="#252525">снизится доля визитов, в которых</text>
<text x="228" y="565" font-size="20" fill="#252525">гость пришёл позже</text>
<text x="228" y="591" font-size="20" fill="#252525">забронированного времени.</text>
<rect x="624" y="448" width="400" height="208" rx="16" fill="#fff"/>
<text x="644" y="487" font-size="20" fill="#252525">Если новую дату можно выбрать</text>
<text x="644" y="513" font-size="20" fill="#252525">из истории бронирований, повторная</text>
<text x="644" y="539" font-size="20" fill="#252525">бронь займёт меньше времени,</text>
<text x="644" y="565" font-size="20" fill="#252525">чем при поиске того же ресторана</text>
<text x="644" y="591" font-size="20" fill="#252525">по названию.</text>
</svg>
