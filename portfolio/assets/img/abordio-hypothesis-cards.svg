<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="892" viewBox="0 0 1120 892" font-family="Arial, sans-serif">
<title>Продуктовые гипотезы и метрики Abordio</title>
<rect width="100%" height="100%" fill="#f4f4f4"/>
<rect x="0" y="0" width="362" height="272" rx="16" fill="#fff"/>
<text x="20" y="33" font-size="19" font-weight="600" fill="#252525">Ресторан рядом</text>
<text x="20" y="61" font-size="17" font-weight="400" fill="#252525">Если показать на карте ближайшие</text>
<text x="20" y="83" font-size="17" font-weight="400" fill="#252525">рестораны, где сейчас есть свободный</text>
<text x="20" y="105" font-size="17" font-weight="400" fill="#252525">стол, гость быстрее найдёт место</text>
<text x="20" y="127" font-size="17" font-weight="400" fill="#252525">для спонтанного ужина.</text>
<text x="20" y="158" font-size="15" font-weight="400" fill="#575757">Что измерить</text>
<text x="20" y="180" font-size="16" font-weight="400" fill="#252525">Время от начала поиска до выбора</text>
<text x="20" y="200" font-size="16" font-weight="400" fill="#252525">ресторана со свободным столом.</text>
<rect x="379" y="0" width="362" height="272" rx="16" fill="#fff"/>
<text x="399" y="33" font-size="19" font-weight="600" fill="#252525">Посадка без ожидания</text>
<text x="399" y="61" font-size="17" font-weight="400" fill="#252525">Если стол закрепляется за гостем</text>
<text x="399" y="83" font-size="17" font-weight="400" fill="#252525">к выбранному времени и ресторан</text>
<text x="399" y="105" font-size="17" font-weight="400" fill="#252525">видит эту бронь, гостю придётся</text>
<text x="399" y="127" font-size="17" font-weight="400" fill="#252525">меньше ждать на месте.</text>
<text x="399" y="158" font-size="15" font-weight="400" fill="#575757">Что измерить</text>
<text x="399" y="180" font-size="16" font-weight="400" fill="#252525">Фактическое время от прихода гостя</text>
<text x="399" y="200" font-size="16" font-weight="400" fill="#252525">до посадки.</text>
<rect x="758" y="0" width="362" height="272" rx="16" fill="#fff"/>
<text x="778" y="33" font-size="19" font-weight="600" fill="#252525">Выбор конкретного стола</text>
<text x="778" y="61" font-size="17" font-weight="400" fill="#252525">Если при бронировании можно выбрать</text>
<text x="778" y="83" font-size="17" font-weight="400" fill="#252525">стол на плане зала и увидеть,</text>
<text x="778" y="105" font-size="17" font-weight="400" fill="#252525">где он расположен, гости, которым</text>
<text x="778" y="127" font-size="17" font-weight="400" fill="#252525">важно место, будут реже просить о</text>
<text x="778" y="149" font-size="17" font-weight="400" fill="#252525">пересадке.</text>
<text x="778" y="180" font-size="15" font-weight="400" fill="#575757">Что измерить</text>
<text x="778" y="202" font-size="16" font-weight="400" fill="#252525">Доля гостей, попросивших другой стол,</text>
<text x="778" y="222" font-size="16" font-weight="400" fill="#252525">среди тех, кто выбирал место на плане.</text>
<rect x="0" y="289" width="362" height="292" rx="16" fill="#fff"/>
<text x="20" y="322" font-size="19" font-weight="600" fill="#252525">Скидка на стол</text>
<text x="20" y="350" font-size="17" font-weight="400" fill="#252525">Если рядом со столом указать размер</text>
<text x="20" y="372" font-size="17" font-weight="400" fill="#252525">скидки, а до подтверждения объяснить,</text>
<text x="20" y="394" font-size="17" font-weight="400" fill="#252525">на какие позиции и время она</text>
<text x="20" y="416" font-size="17" font-weight="400" fill="#252525">действует, гость сможет заранее</text>
<text x="20" y="438" font-size="17" font-weight="400" fill="#252525">понять, сколько сэкономит.</text>
<text x="20" y="469" font-size="15" font-weight="400" fill="#575757">Что измерить</text>
<text x="20" y="491" font-size="16" font-weight="400" fill="#252525">Доля гостей, которые до бронирования</text>
<text x="20" y="511" font-size="16" font-weight="400" fill="#252525">правильно определяют скидку на примере</text>
<text x="20" y="531" font-size="16" font-weight="400" fill="#252525">заказа.</text>
<rect x="379" y="289" width="362" height="292" rx="16" fill="#fff"/>
<text x="399" y="322" font-size="19" font-weight="600" fill="#252525">Пожелания к визиту</text>
<text x="399" y="350" font-size="17" font-weight="400" fill="#252525">Если гость может оставить пожелание</text>
<text x="399" y="372" font-size="17" font-weight="400" fill="#252525">при бронировании, а сотрудники увидят</text>
<text x="399" y="394" font-size="17" font-weight="400" fill="#252525">его вместе с бронью, гостю реже</text>
<text x="399" y="416" font-size="17" font-weight="400" fill="#252525">придётся отдельно звонить в ресторан.</text>
<text x="399" y="447" font-size="15" font-weight="400" fill="#575757">Что измерить</text>
<text x="399" y="469" font-size="16" font-weight="400" fill="#252525">Доля гостей, которым после отправки</text>
<text x="399" y="489" font-size="16" font-weight="400" fill="#252525">пожелания понадобился дополнительный</text>
<text x="399" y="509" font-size="16" font-weight="400" fill="#252525">звонок.</text>
<rect x="758" y="289" width="362" height="292" rx="16" fill="#fff"/>
<text x="778" y="322" font-size="19" font-weight="600" fill="#252525">Депозит</text>
<text x="778" y="350" font-size="17" font-weight="400" fill="#252525">Если до оплаты показать сумму</text>
<text x="778" y="372" font-size="17" font-weight="400" fill="#252525">депозита, причину и крайний срок</text>
<text x="778" y="394" font-size="17" font-weight="400" fill="#252525">отмены с полным возвратом, гостю</text>
<text x="778" y="416" font-size="17" font-weight="400" fill="#252525">будет проще решить, готов</text>
<text x="778" y="438" font-size="17" font-weight="400" fill="#252525">ли он бронировать.</text>
<text x="778" y="469" font-size="15" font-weight="400" fill="#575757">Что измерить</text>
<text x="778" y="491" font-size="16" font-weight="400" fill="#252525">Доля гостей, которые правильно называют</text>
<text x="778" y="511" font-size="16" font-weight="400" fill="#252525">сумму депозита и срок полного возврата.</text>
<rect x="0" y="598" width="362" height="294" rx="16" fill="#fff"/>
<text x="20" y="631" font-size="19" font-weight="600" fill="#252525">Замена стола</text>
<text x="20" y="659" font-size="17" font-weight="400" fill="#252525">Если ресторан покажет, какой стол</text>
<text x="20" y="681" font-size="17" font-weight="400" fill="#252525">предлагает взамен, и даст гостю выбор</text>
<text x="20" y="703" font-size="17" font-weight="400" fill="#252525">между заменой и отменой с полным</text>
<text x="20" y="725" font-size="17" font-weight="400" fill="#252525">возвратом депозита, гость сможет</text>
<text x="20" y="747" font-size="17" font-weight="400" fill="#252525">решить, сохранять ли визит, без звонка</text>
<text x="20" y="769" font-size="17" font-weight="400" fill="#252525">в ресторан.</text>
<text x="20" y="800" font-size="15" font-weight="400" fill="#575757">Что измерить</text>
<text x="20" y="822" font-size="16" font-weight="400" fill="#252525">Доля гостей, которые самостоятельно</text>
<text x="20" y="842" font-size="16" font-weight="400" fill="#252525">приняли замену или оформили отмену.</text>
<rect x="379" y="598" width="362" height="294" rx="16" fill="#fff"/>
<text x="399" y="631" font-size="19" font-weight="600" fill="#252525">Напоминание</text>
<text x="399" y="659" font-size="17" font-weight="400" fill="#252525">Если перед визитом прислать</text>
<text x="399" y="681" font-size="17" font-weight="400" fill="#252525">напоминание со временем брони</text>
<text x="399" y="703" font-size="17" font-weight="400" fill="#252525">и адресом, гостю будет проще вовремя</text>
<text x="399" y="725" font-size="17" font-weight="400" fill="#252525">добраться до ресторана.</text>
<text x="399" y="756" font-size="15" font-weight="400" fill="#575757">Что измерить</text>
<text x="399" y="778" font-size="16" font-weight="400" fill="#252525">Доля гостей, пришедших</text>
<text x="399" y="798" font-size="16" font-weight="400" fill="#252525">к забронированному времени.</text>
<rect x="758" y="598" width="362" height="294" rx="16" fill="#fff"/>
<text x="778" y="631" font-size="19" font-weight="600" fill="#252525">Повторная бронь</text>
<text x="778" y="659" font-size="17" font-weight="400" fill="#252525">Если из истории посещений можно</text>
<text x="778" y="681" font-size="17" font-weight="400" fill="#252525">сразу перейти к новой брони в том же</text>
<text x="778" y="703" font-size="17" font-weight="400" fill="#252525">ресторане, гость забронирует знакомое</text>
<text x="778" y="725" font-size="17" font-weight="400" fill="#252525">место быстрее.</text>
<text x="778" y="756" font-size="15" font-weight="400" fill="#575757">Что измерить</text>
<text x="778" y="778" font-size="16" font-weight="400" fill="#252525">Время до подтверждения повторной</text>
<text x="778" y="798" font-size="16" font-weight="400" fill="#252525">брони через историю по сравнению</text>
<text x="778" y="818" font-size="16" font-weight="400" fill="#252525">с поиском по названию.</text>
</svg>
