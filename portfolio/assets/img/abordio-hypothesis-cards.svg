<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 962 656" width="962" height="656" font-family="Arial, sans-serif">
<title>Продуктовые гипотезы</title>
<rect width="100%" height="100%" fill="#f4f4f4"/>
<rect x="0" y="0" width="310" height="208" rx="16" fill="#fff"/>
<text x="20" y="60" font-size="18" fill="#252525">Если на карте показывать</text>
<text x="20" y="84" font-size="18" fill="#252525">ближайшие рестораны со</text>
<text x="20" y="108" font-size="18" fill="#252525">свободным столом, сократится</text>
<text x="20" y="132" font-size="18" fill="#252525">время от начала поиска до</text>
<text x="20" y="156" font-size="18" fill="#252525">выбора ресторана.</text>
<rect x="326" y="0" width="310" height="208" rx="16" fill="#fff"/>
<text x="346" y="60" font-size="18" fill="#252525">Если гость заранее выбирает</text>
<text x="346" y="84" font-size="18" fill="#252525">конкретный стол, время от</text>
<text x="346" y="108" font-size="18" fill="#252525">прихода до посадки будет</text>
<text x="346" y="132" font-size="18" fill="#252525">меньше, чем при бронировании</text>
<text x="346" y="156" font-size="18" fill="#252525">без выбора стола.</text>
<rect x="652" y="0" width="310" height="208" rx="16" fill="#fff"/>
<text x="672" y="48" font-size="18" fill="#252525">Если нажатие на свободное</text>
<text x="672" y="72" font-size="18" fill="#252525">время в карточке ресторана</text>
<text x="672" y="96" font-size="18" fill="#252525">открывает бронь на этот час,</text>
<text x="672" y="120" font-size="18" fill="#252525">вырастет конверсия из</text>
<text x="672" y="144" font-size="18" fill="#252525">просмотра карточки в</text>
<text x="672" y="168" font-size="18" fill="#252525">подтверждённую бронь.</text>
<rect x="0" y="224" width="310" height="208" rx="16" fill="#fff"/>
<text x="20" y="274" font-size="18" fill="#252525">Если при выборе стола</text>
<text x="20" y="298" font-size="18" fill="#252525">показать размер скидки, часы и</text>
<text x="20" y="322" font-size="18" fill="#252525">условия её действия, больше</text>
<text x="20" y="346" font-size="18" fill="#252525">гостей правильно определят,</text>
<text x="20" y="370" font-size="18" fill="#252525">действует ли скидка на их</text>
<text x="20" y="394" font-size="18" fill="#252525">заказ.</text>
<rect x="326" y="224" width="310" height="208" rx="16" fill="#fff"/>
<text x="346" y="284" font-size="18" fill="#252525">Если повод для визита можно</text>
<text x="346" y="308" font-size="18" fill="#252525">указать при бронировании, на</text>
<text x="346" y="332" font-size="18" fill="#252525">100 броней придётся меньше</text>
<text x="346" y="356" font-size="18" fill="#252525">звонков и сообщений с этой</text>
<text x="346" y="380" font-size="18" fill="#252525">информацией.</text>
<rect x="652" y="224" width="310" height="208" rx="16" fill="#fff"/>
<text x="672" y="272" font-size="18" fill="#252525">Если до оплаты объяснить</text>
<text x="672" y="296" font-size="18" fill="#252525">назначение депозита, показать</text>
<text x="672" y="320" font-size="18" fill="#252525">сумму за всю компанию и срок</text>
<text x="672" y="344" font-size="18" fill="#252525">полного возврата, снизится</text>
<text x="672" y="368" font-size="18" fill="#252525">доля гостей, которым нужно</text>
<text x="672" y="392" font-size="18" fill="#252525">уточнить условия у ресторана.</text>
<rect x="163" y="448" width="310" height="208" rx="16" fill="#fff"/>
<text x="183" y="496" font-size="18" fill="#252525">Если перед визитом напомнить</text>
<text x="183" y="520" font-size="18" fill="#252525">гостю время брони и адрес</text>
<text x="183" y="544" font-size="18" fill="#252525">ресторана, снизится доля</text>
<text x="183" y="568" font-size="18" fill="#252525">визитов, в которых гость</text>
<text x="183" y="592" font-size="18" fill="#252525">пришёл позже</text>
<text x="183" y="616" font-size="18" fill="#252525">забронированного времени.</text>
<rect x="489" y="448" width="310" height="208" rx="16" fill="#fff"/>
<text x="509" y="496" font-size="18" fill="#252525">Если из истории посещений</text>
<text x="509" y="520" font-size="18" fill="#252525">можно сразу забронировать</text>
<text x="509" y="544" font-size="18" fill="#252525">стол в знакомом ресторане,</text>
<text x="509" y="568" font-size="18" fill="#252525">гость быстрее подтвердит</text>
<text x="509" y="592" font-size="18" fill="#252525">повторную бронь, чем при</text>
<text x="509" y="616" font-size="18" fill="#252525">поиске ресторана по названию.</text>
</svg>
