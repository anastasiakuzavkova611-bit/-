<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 962 656" width="962" height="656" font-family="Arial, sans-serif">
<title>Продуктовые гипотезы</title>
<rect width="100%" height="100%" fill="#f4f4f4"/>
<rect x="0" y="0" width="310" height="208" rx="16" fill="#fff"/>
<text x="20" y="38" font-size="18" fill="#252525">Если на карте показывать</text>
<text x="20" y="62" font-size="18" fill="#252525">ближайшие рестораны со</text>
<text x="20" y="86" font-size="18" fill="#252525">свободным столом, сократится</text>
<text x="20" y="110" font-size="18" fill="#252525">время от начала поиска до</text>
<text x="20" y="134" font-size="18" fill="#252525">выбора ресторана.</text>
<rect x="326" y="0" width="310" height="208" rx="16" fill="#fff"/>
<text x="346" y="38" font-size="18" fill="#252525">Если гость заранее выбирает</text>
<text x="346" y="62" font-size="18" fill="#252525">конкретный стол, время от</text>
<text x="346" y="86" font-size="18" fill="#252525">прихода до посадки будет</text>
<text x="346" y="110" font-size="18" fill="#252525">меньше, чем при бронировании</text>
<text x="346" y="134" font-size="18" fill="#252525">без выбора стола.</text>
<rect x="652" y="0" width="310" height="208" rx="16" fill="#fff"/>
<text x="672" y="38" font-size="18" fill="#252525">Если нажатие на свободное</text>
<text x="672" y="62" font-size="18" fill="#252525">время в карточке ресторана</text>
<text x="672" y="86" font-size="18" fill="#252525">открывает бронь на этот час,</text>
<text x="672" y="110" font-size="18" fill="#252525">вырастет конверсия из</text>
<text x="672" y="134" font-size="18" fill="#252525">просмотра карточки в</text>
<text x="672" y="158" font-size="18" fill="#252525">подтверждённую бронь.</text>
<rect x="0" y="224" width="310" height="208" rx="16" fill="#fff"/>
<text x="20" y="262" font-size="18" fill="#252525">Если при выборе стола</text>
<text x="20" y="286" font-size="18" fill="#252525">показать размер скидки, часы и</text>
<text x="20" y="310" font-size="18" fill="#252525">условия её действия, больше</text>
<text x="20" y="334" font-size="18" fill="#252525">гостей правильно определят,</text>
<text x="20" y="358" font-size="18" fill="#252525">действует ли скидка на их</text>
<text x="20" y="382" font-size="18" fill="#252525">заказ.</text>
<rect x="326" y="224" width="310" height="208" rx="16" fill="#fff"/>
<text x="346" y="262" font-size="18" fill="#252525">Если повод для визита можно</text>
<text x="346" y="286" font-size="18" fill="#252525">указать при бронировании, на</text>
<text x="346" y="310" font-size="18" fill="#252525">100 броней придётся меньше</text>
<text x="346" y="334" font-size="18" fill="#252525">звонков и сообщений с этой</text>
<text x="346" y="358" font-size="18" fill="#252525">информацией.</text>
<rect x="652" y="224" width="310" height="208" rx="16" fill="#fff"/>
<text x="672" y="262" font-size="18" fill="#252525">Если до оплаты объяснить</text>
<text x="672" y="286" font-size="18" fill="#252525">назначение депозита, показать</text>
<text x="672" y="310" font-size="18" fill="#252525">сумму за всю компанию и срок</text>
<text x="672" y="334" font-size="18" fill="#252525">полного возврата, снизится</text>
<text x="672" y="358" font-size="18" fill="#252525">доля гостей, которым нужно</text>
<text x="672" y="382" font-size="18" fill="#252525">уточнить условия у ресторана.</text>
<rect x="0" y="448" width="310" height="208" rx="16" fill="#fff"/>
<text x="20" y="486" font-size="18" fill="#252525">Если перед визитом напомнить</text>
<text x="20" y="510" font-size="18" fill="#252525">гостю время брони и адрес</text>
<text x="20" y="534" font-size="18" fill="#252525">ресторана, снизится доля</text>
<text x="20" y="558" font-size="18" fill="#252525">визитов, в которых гость</text>
<text x="20" y="582" font-size="18" fill="#252525">пришёл позже</text>
<text x="20" y="606" font-size="18" fill="#252525">забронированного времени.</text>
<rect x="326" y="448" width="310" height="208" rx="16" fill="#fff"/>
<text x="346" y="486" font-size="18" fill="#252525">Если оценку можно поставить в</text>
<text x="346" y="510" font-size="18" fill="#252525">завершённой брони, а фото</text>
<text x="346" y="534" font-size="18" fill="#252525">добавить по желанию,</text>
<text x="346" y="558" font-size="18" fill="#252525">сократится время от открытия</text>
<text x="346" y="582" font-size="18" fill="#252525">формы до отправки отзыва.</text>
<rect x="652" y="448" width="310" height="208" rx="16" fill="#fff"/>
<text x="672" y="486" font-size="18" fill="#252525">Если новую дату можно</text>
<text x="672" y="510" font-size="18" fill="#252525">выбрать из истории</text>
<text x="672" y="534" font-size="18" fill="#252525">бронирований, повторная</text>
<text x="672" y="558" font-size="18" fill="#252525">бронь займёт меньше времени,</text>
<text x="672" y="582" font-size="18" fill="#252525">чем при поиске того же</text>
<text x="672" y="606" font-size="18" fill="#252525">ресторана по названию.</text>
</svg>
