<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="586" viewBox="0 0 1120 586" font-family="Arial, sans-serif">
<title>Продуктовые гипотезы</title>
<rect width="100%" height="100%" fill="#f4f4f4"/>
<rect x="0" y="0" width="362" height="184" rx="16" fill="#fff"/>
<text x="20" y="37" font-size="17" fill="#252525">Если на карте видны рестораны</text>
<text x="20" y="61" font-size="17" fill="#252525">со свободными столами, гость быстрее</text>
<text x="20" y="85" font-size="17" fill="#252525">найдёт, где поесть рядом.</text>
<rect x="379" y="0" width="362" height="184" rx="16" fill="#fff"/>
<text x="399" y="37" font-size="17" fill="#252525">Если ресторан заранее видит, какой</text>
<text x="399" y="61" font-size="17" fill="#252525">стол и на какое время забронирован,</text>
<text x="399" y="85" font-size="17" fill="#252525">гость меньше ждёт посадки.</text>
<rect x="758" y="0" width="362" height="184" rx="16" fill="#fff"/>
<text x="778" y="37" font-size="17" fill="#252525">Если гости сами выбирают стол</text>
<text x="778" y="61" font-size="17" fill="#252525">на плане зала, они реже просят</text>
<text x="778" y="85" font-size="17" fill="#252525">пересадить их во время визита.</text>
<rect x="0" y="201" width="362" height="184" rx="16" fill="#fff"/>
<text x="20" y="238" font-size="17" fill="#252525">Если при выборе стола видны размер</text>
<text x="20" y="262" font-size="17" fill="#252525">скидки, часы действия и блюда</text>
<text x="20" y="286" font-size="17" fill="#252525">со скидкой, гость точнее оценит</text>
<text x="20" y="310" font-size="17" fill="#252525">экономию.</text>
<rect x="379" y="201" width="362" height="184" rx="16" fill="#fff"/>
<text x="399" y="238" font-size="17" fill="#252525">Если ресторан получает пожелания</text>
<text x="399" y="262" font-size="17" fill="#252525">вместе с бронью, гости реже звонят,</text>
<text x="399" y="286" font-size="17" fill="#252525">чтобы уточнить детали визита.</text>
<rect x="758" y="201" width="362" height="184" rx="16" fill="#fff"/>
<text x="778" y="238" font-size="17" fill="#252525">Если до оплаты объяснить,</text>
<text x="778" y="262" font-size="17" fill="#252525">за что берут депозит, и указать сумму</text>
<text x="778" y="286" font-size="17" fill="#252525">и срок полного возврата, гости точнее</text>
<text x="778" y="310" font-size="17" fill="#252525">оценят условия брони.</text>
<rect x="0" y="402" width="362" height="184" rx="16" fill="#fff"/>
<text x="20" y="439" font-size="17" fill="#252525">Если в приложении можно принять</text>
<text x="20" y="463" font-size="17" fill="#252525">другой стол или отменить бронь</text>
<text x="20" y="487" font-size="17" fill="#252525">с полным возвратом, больше гостей</text>
<text x="20" y="511" font-size="17" fill="#252525">решат вопрос без звонка в ресторан.</text>
<rect x="379" y="402" width="362" height="184" rx="16" fill="#fff"/>
<text x="399" y="439" font-size="17" fill="#252525">Если в напоминании указать время</text>
<text x="399" y="463" font-size="17" fill="#252525">брони и адрес ресторана, больше</text>
<text x="399" y="487" font-size="17" fill="#252525">гостей придут вовремя.</text>
<rect x="758" y="402" width="362" height="184" rx="16" fill="#fff"/>
<text x="778" y="439" font-size="17" fill="#252525">Если начать новую бронь из истории</text>
<text x="778" y="463" font-size="17" fill="#252525">посещений, гость быстрее забронирует</text>
<text x="778" y="487" font-size="17" fill="#252525">стол в знакомом ресторане.</text>
</svg>
