<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 72" role="img" aria-label="Фото Анастасии (заглушка)">
  <defs>
    <linearGradient id="avatarBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#009dff"/>
      <stop offset="1" stop-color="#5cc9ff"/>
    </linearGradient>
    <clipPath id="avatarClip">
      <rect width="100" height="72" rx="36"/>
    </clipPath>
  </defs>
  <g clip-path="url(#avatarClip)">
    <rect width="100" height="72" fill="url(#avatarBg)"/>
    <circle cx="50" cy="30" r="16" fill="rgba(255,255,255,0.9)"/>
    <ellipse cx="50" cy="78" rx="30" ry="26" fill="rgba(255,255,255,0.9)"/>
  </g>
